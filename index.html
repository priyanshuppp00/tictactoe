<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="js-dark">



  <h1 class="heading">Tic-Tac-Toe</h1>
  <button id="voice-btn" class="voice-btn">🎙️ Voice Mode</button>
  <button class="mode-btn" id="mode-toggle">MODE</button>



  <div class="mode-selection">
    <h2>Choose Game Mode</h2>
    <button id="friend-mode">Play with Friend</button>
    <button id="ai-mode">Play with AI</button>
  </div>

  <div class="game-container hide">
    <div class="game">
      <button class="box" data-index="0"></button>
      <button class="box" data-index="1"></button>
      <button class="box" data-index="2"></button>
      <button class="box" data-index="3"></button>
      <button class="box" data-index="4"></button>
      <button class="box" data-index="5"></button>
      <button class="box" data-index="6"></button>
      <button class="box" data-index="7"></button>
      <button class="box" data-index="8"></button>
    </div>


    <button id="reset-btn">🔄 Reset Game</button>


    <div class="history-container">
      <h3 class="history">Game History</h3>
      <ul id="history-list"></ul>
    </div>
  </div>


  <div class="popup hide">
    <p id="popup-message"></p>
    <button id="new-game-btn">Start New Game</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
